title: TimeCondition
description: Condition on a timestamp.
type: object
additionalProperties: false
required:
  - type
  - operation
  - value
properties:
  type:
    type: string
    enum:
      - time
  operation:
    $ref: ./ComparisonOperation.yaml
  value:
    description: Comparison threshold in ISO 8601.
    type: string
    format: date-time
    example: "2026-12-01T09:00:00Z"
