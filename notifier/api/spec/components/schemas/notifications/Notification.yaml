title: Notification
description: Notification parameters and status outside DLQ.
type: object
additionalProperties: false
required:
  - notification_id
  - external_id
  - notification_params
  - deadline_dt
  - start_dt
properties:
  notification_id:
    $ref: ./NotificationId.yaml
  external_id:
    $ref: ./ExternalId.yaml
  notification_status:
    $ref: ./OrdinaryNotificationStatus.yaml
  delivery_status:
    $ref: ./DeliveryStatus.yaml
  notification_params:
    $ref: ../conditions/NotificationParams.yaml
  deadline_dt:
    type: string
    format: date-time
    example: "2026-12-01T18:00:00Z"
  start_dt:
    description: Moment when the notification was created.
    type: string
    format: date-time
    example: "2026-11-13T10:00:00Z"
