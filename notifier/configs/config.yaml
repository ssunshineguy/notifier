# Credentials of the local stand only, see db/init.
api:
  listen_addr: 127.0.0.1:8080
  max_in_flight: 16
  max_queued: 16
  slot_wait_timeout_ms: 100
  request_timeout_ms: 2000

worker:
  workers: 2
  batch_size: 8
  cycle_timeout_ms: 2000

infoservice:
  base_url: http://emulator:8081
  time_timeout_ms: 200
  price_timeout_ms: 200

database:
  min_conns: 4
  max_conns: 8
  operation_timeout_sec: 1
  migrator_dsn: postgres://notifier_migrator:notifier_migrator@postgres:5432/notifier?sslmode=disable
  api_dsn: postgres://notifier_api:notifier_api@postgres:5432/notifier?sslmode=disable
  worker_dsn: postgres://notifier_worker:notifier_worker@postgres:5432/notifier?sslmode=disable
  collector_dsn: postgres://notifier_collector:notifier_collector@postgres:5432/notifier?sslmode=disable

notification:
  scheduled_time_sec: 10
  lock_duration_ms: 2000
