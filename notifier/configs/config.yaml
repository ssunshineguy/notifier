# Shared non-secret settings for Notifier modes.
api:
  listen_addr: 127.0.0.1:8080
  max_in_flight: 16
  max_connections: 1024
  max_queued: 16
  slot_wait_timeout_ms: 100
  request_timeout_ms: 300
  write_timeout_ms: 1000
  idle_timeout_ms: 60000

worker:
  workers: 2
  batch_size: 8
  cycle_timeout_ms: 2000

infoservice:
  base_url: http://emulator:8081
  time_timeout_ms: 200
  price_timeout_ms: 200

database:
  min_conns: 4
  max_conns: 8
  operation_timeout_sec: 1

notification:
  initial_check_delay_sec: 0
  scheduled_time_sec: 10
  lock_duration_ms: 2000
