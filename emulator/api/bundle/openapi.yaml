openapi: 3.0.3
info:
  title: Notifier Emulator API
  version: 0.1.0
  description: |
    Emulates two Information Services and the client's callback endpoint for
    local Notifier tests. Information Service requests carry a client identifier
    and a request identifier. The callback follows the event contract in the
    Notifier API.

    Test controls store overrides in the emulator process. Restarting the
    process clears all overrides.

    ## Body size

    JSON request bodies are limited to 32768 bytes (32 KiB), including whitespace
    and escape sequences. This is an explicit byte limit in addition to field
    validation; it does not accept every textual representation of the same object.
    Oversized bodies return `413` when their declared length or decoder read
    exceeds the limit, including chunked requests. Authentication or other checks
    may reject a request before its body is read.
    Notifier applies the same byte limit to Information Service response bodies;
    exceeding it is a data-fetch error, not a usable time or price.
servers:
  - url: http://localhost:8081
    description: Local emulator
security: []
tags:
  - name: information-services
    description: Emulated sources for notification conditions.
  - name: callbacks
    description: Delivery of events by Notifier.
  - name: test-presets
    description: Configure and reset emulator overrides.
paths:
  /time:
    get:
      operationId: getTime
      tags:
        - information-services
      summary: Get the emulated time
      description: Returns the client's configured time or the current time in UTC.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Emulated time in UTC.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Time'
              example:
                time: '2026-12-01T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadInformationRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
  /price:
    get:
      operationId: getPrice
      tags:
        - information-services
      summary: Get the emulated price
      description: Returns the client's configured price in minor units or zero.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Emulated price in minor units.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
              example:
                price: 19990
        '400':
          $ref: '#/components/responses/BadInformationRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
  /callback:
    post:
      operationId: receiveNotificationEvent
      tags:
        - callbacks
      summary: Receive a Notifier event
      description: |
        Receives the notification event sent by Notifier Worker when the conditions
        are met or the deadline is reached. Delivery is at least once, so the same
        notification identifier may be received more than once.

        Uses the response status and delay configured for the notification
        identifier. The default is 200 with no delay. An override applies to every
        attempt until it is replaced or deleted.
        If the emulator shuts down during a delay, it returns 503 when the
        connection is still open.
      requestBody:
        description: JSON body limited to 32768 bytes (32 KiB), including whitespace and escapes.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationEvent'
            example:
              notification_id: 0193a1f4-6c2e-7d55-9b1a-3f0c2e8d4a71
              external_id: order-42-reminder
              notification_status: success
              sent_dt: '2026-12-01T09:00:01Z'
      responses:
        '200':
          description: The event is accepted.
        '201':
          description: The event is accepted with the configured 201 status.
        '400':
          $ref: '#/components/responses/BadEvent'
        '404':
          $ref: '#/components/responses/SimulatedCallbackFailure'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/SimulatedCallbackFailure'
        '503':
          $ref: '#/components/responses/SimulatedCallbackFailure'
  /v1/client-overrides/{client_id}:
    parameters:
      - $ref: '#/components/parameters/ClientOverrideId'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: setClientOverride
      tags:
        - test-presets
      summary: Set an Information Service value for a client
      description: Sets or replaces the selected parameter. The client's other parameter keeps its value.
      requestBody:
        description: JSON body limited to 32768 bytes (32 KiB), including whitespace and escapes.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientOverride'
            examples:
              time:
                value:
                  parameter: time
                  value: '2026-12-01T09:00:00Z'
              price:
                value:
                  parameter: price
                  value: 19990
      responses:
        '200':
          $ref: '#/components/responses/OverrideApplied'
        '400':
          $ref: '#/components/responses/BadOverrideRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      operationId: resetClientOverrides
      tags:
        - test-presets
      summary: Reset a client's Information Service values
      description: Clears both parameters for the client. Returns 200 even if no override exists.
      responses:
        '200':
          $ref: '#/components/responses/OverrideApplied'
        '400':
          $ref: '#/components/responses/BadOverrideRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
  /v1/callback-overrides/{notification_id}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: setCallbackOverride
      tags:
        - test-presets
      summary: Set the callback response for a notification
      description: Creates or replaces the response status and delay for the notification.
      requestBody:
        description: JSON body limited to 32768 bytes (32 KiB), including whitespace and escapes.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackOverride'
            example:
              status_code: 503
              response_timeout: 1500
      responses:
        '200':
          $ref: '#/components/responses/OverrideApplied'
        '400':
          $ref: '#/components/responses/BadOverrideRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      operationId: resetCallbackOverride
      tags:
        - test-presets
      summary: Reset a notification's callback response
      description: Restores 200 with no delay. Returns 200 even if no override exists.
      responses:
        '200':
          $ref: '#/components/responses/OverrideApplied'
        '400':
          $ref: '#/components/responses/BadOverrideRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      description: |
        Identifier of the request for tracing. Returned in the response header
        and in error bodies.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: 6f1c2a9e-0d4b-4b8e-9a51-2c7d3e8f1a20
    ClientId:
      name: X-Client-ID
      in: header
      required: true
      description: Identifier of the Notifier client associated with the request.
      schema:
        type: string
        minLength: 1
        example: emulator-test-client
    ClientOverrideId:
      name: client_id
      in: path
      required: true
      description: Value of `X-Client-ID` used by the Information Service requests.
      schema:
        type: string
        minLength: 1
        example: emulator-test-client
    NotificationId:
      name: notification_id
      in: path
      required: true
      description: Identifier of the notification.
      schema:
        $ref: '#/components/schemas/NotificationId'
  headers:
    RequestId:
      description: Echo of the `X-Request-ID` request header.
      schema:
        type: string
        example: 6f1c2a9e-0d4b-4b8e-9a51-2c7d3e8f1a20
  schemas:
    Time:
      title: Time
      type: object
      required:
        - time
      properties:
        time:
          description: Emulated UTC timestamp in ISO 8601 (RFC 3339) format.
          type: string
          format: date-time
          x-ogen-time-format: 2006-01-02T15:04:05.999999999Z07:00
          example: '2026-12-01T09:00:00Z'
    FieldError:
      title: FieldError
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          description: JSON Pointer to the invalid field.
          type: string
          example: /deadline_dt
        message:
          type: string
          example: must be in the future
    Problem:
      title: Problem
      description: Error in the RFC 9457 Problem Details format.
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          description: URI identifying the error kind.
          type: string
          format: uri-reference
          example: /problems/validation-error
        title:
          description: Short summary of the error kind, the same for all occurrences.
          type: string
          example: Request validation failed
        status:
          description: HTTP status code.
          type: integer
          example: 400
        detail:
          description: Explanation specific to this occurrence.
          type: string
          example: deadline_dt must be in the future
        request_id:
          description: Value of `X-Request-ID` of the failed request.
          type: string
          example: 6f1c2a9e-0d4b-4b8e-9a51-2c7d3e8f1a20
        errors:
          description: Field-level errors, present for validation failures.
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Price:
      title: Price
      type: object
      required:
        - price
      properties:
        price:
          description: |
            Price as an integer count of minor units. One major unit equals 100
            minor units. For example, 19990 represents 199.90 major units.
          type: integer
          format: int64
          example: 19990
    NotificationId:
      title: NotificationId
      description: Identifier of the notification assigned by Notifier.
      type: string
      format: uuid
      example: 0193a1f4-6c2e-7d55-9b1a-3f0c2e8d4a71
    ExternalId:
      title: ExternalId
      description: |
        Client-side identifier of the notification. Unique per client: a repeated
        create with the same `external_id` returns `409` with the identifier of
        the existing notification, which makes creation safe to retry. The
        parameters of the repeated request are not applied.
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
      example: order-42-reminder
    EventStatus:
      title: EventStatus
      description: |
        - `success` — the conditions were met.
        - `deadline_exceeded` — the conditions were not met before `deadline_dt`.
      type: string
      enum:
        - success
        - deadline_exceeded
      example: success
    NotificationEvent:
      title: NotificationEvent
      description: |
        Event that Notifier sends to the client. Delivery is at-least-once:
        the same event may arrive more than once, use `notification_id` to
        deduplicate.
      type: object
      additionalProperties: false
      required:
        - notification_id
        - external_id
        - notification_status
        - sent_dt
      properties:
        notification_id:
          $ref: '#/components/schemas/NotificationId'
        external_id:
          $ref: '#/components/schemas/ExternalId'
        notification_status:
          $ref: '#/components/schemas/EventStatus'
        sent_dt:
          description: Moment of this delivery attempt.
          type: string
          format: date-time
          example: '2026-12-01T09:00:01Z'
    ClientTimeOverride:
      title: ClientTimeOverride
      type: object
      additionalProperties: false
      required:
        - parameter
        - value
      properties:
        parameter:
          type: string
          enum:
            - time
        value:
          description: RFC 3339 timestamp whose UTC year is between 0000 and 9999, returned as UTC by GET /time.
          type: string
          format: date-time
          example: '2026-12-01T09:00:00Z'
    ClientPriceOverride:
      title: ClientPriceOverride
      type: object
      additionalProperties: false
      required:
        - parameter
        - value
      properties:
        parameter:
          type: string
          enum:
            - price
        value:
          description: Price in minor units, where 19990 represents 199.90 major units.
          type: integer
          format: int64
          example: 19990
    ClientOverride:
      title: ClientOverride
      oneOf:
        - $ref: '#/components/schemas/ClientTimeOverride'
        - $ref: '#/components/schemas/ClientPriceOverride'
      discriminator:
        propertyName: parameter
        mapping:
          time: '#/components/schemas/ClientTimeOverride'
          price: '#/components/schemas/ClientPriceOverride'
    CallbackOverride:
      title: CallbackOverride
      type: object
      additionalProperties: false
      required:
        - status_code
        - response_timeout
      properties:
        status_code:
          description: HTTP status returned by POST /callback.
          type: integer
          enum:
            - 200
            - 201
            - 400
            - 404
            - 500
            - 503
          example: 503
        response_timeout:
          description: Delay in milliseconds before returning the configured status. Zero returns immediately.
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 1500
  responses:
    BadInformationRequest:
      description: A required request header is missing or invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/validation-error
            title: Request validation failed
            status: 400
            detail: X-Client-ID is required
            request_id: 6f1c2a9e-0d4b-4b8e-9a51-2c7d3e8f1a20
    ContentTooLarge:
      description: The request body exceeds 32768 bytes (32 KiB), including JSON whitespace and escapes.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/content-too-large
            title: Request body exceeds the byte limit
            status: 413
            request_id: 6f1c2a9e-0d4b-4b8e-9a51-2c7d3e8f1a20
    BadEvent:
      description: The notification event fails validation or a 400 response was configured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/validation-error
            title: Request validation failed
            status: 400
            detail: notification_status is invalid
    SimulatedCallbackFailure:
      description: A configured callback failure, or 503 if the emulator is shutting down.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request body must use application/json.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OverrideApplied:
      description: The override was saved or cleared. The response body is empty.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    BadOverrideRequest:
      description: The identifier, request header, or override payload fails validation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/validation-error
            title: Request validation failed
            status: 400
            request_id: 6f1c2a9e-0d4b-4b8e-9a51-2c7d3e8f1a20
