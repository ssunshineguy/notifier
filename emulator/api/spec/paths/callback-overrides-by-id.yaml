parameters:
  - $ref: ../../../../notifier/api/spec/components/parameters/NotificationId.yaml
  - $ref: ../../../../notifier/api/spec/components/parameters/RequestId.yaml
post:
  operationId: setCallbackOverride
  tags:
    - test-presets
  summary: Set the callback response for a notification
  description: Creates or replaces the response status and delay for the notification.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/test-controls/CallbackOverride.yaml
        example:
          status_code: 503
          response_timeout: 1500
  responses:
    "200":
      $ref: ../components/responses/OverrideApplied.yaml
    "400":
      $ref: ../components/responses/BadOverrideRequest.yaml
    "415":
      $ref: ../components/responses/UnsupportedMediaType.yaml
delete:
  operationId: resetCallbackOverride
  tags:
    - test-presets
  summary: Reset a notification's callback response
  description: Restores 200 with no delay. Returns 200 even if no override exists.
  responses:
    "200":
      $ref: ../components/responses/OverrideApplied.yaml
    "400":
      $ref: ../components/responses/BadOverrideRequest.yaml
