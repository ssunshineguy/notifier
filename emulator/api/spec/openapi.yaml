openapi: 3.0.3

info:
  title: Notifier Emulator API
  version: 0.1.0
  description: |
    Emulates two Information Services and the client's callback endpoint for
    local Notifier tests. Information Service requests carry a client identifier
    and a request identifier. The callback follows the event contract in the
    Notifier API.

    Test controls store overrides in the emulator process. Restarting the
    process clears all overrides.

    ## Body size

    JSON request bodies are limited to 32768 bytes (32 KiB), including whitespace
    and escape sequences. This is an explicit byte limit in addition to field
    validation; it does not accept every textual representation of the same object.
    Oversized bodies return `413` when their declared length or decoder read
    exceeds the limit, including chunked requests. Authentication or other checks
    may reject a request before its body is read.
    Notifier applies the same byte limit to Information Service response bodies;
    exceeding it is a data-fetch error, not a usable time or price.

servers:
  - url: http://localhost:8081
    description: Local emulator

security: []

tags:
  - name: information-services
    description: Emulated sources for notification conditions.
  - name: callbacks
    description: Delivery of events by Notifier.
  - name: test-presets
    description: Configure and reset emulator overrides.

paths:
  /time:
    $ref: ./paths/time.yaml
  /price:
    $ref: ./paths/price.yaml
  /callback:
    $ref: ./paths/callback.yaml
  /v1/client-overrides/{client_id}:
    $ref: ./paths/client-overrides-by-id.yaml
  /v1/callback-overrides/{notification_id}:
    $ref: ./paths/callback-overrides-by-id.yaml
