version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # незакрытые тела HTTP-ответов: доставка клиенту, Information Services
    - rowserrcheck # непроверенный rows.Err()
    - sqlclosecheck # незакрытые rows/statements
    - contextcheck # потеря контекста при вызовах
    - noctx # HTTP-запросы без context
    - errorlint # сравнение ошибок без errors.Is/As
    - gosec
    - revive
    - misspell
  exclusions:
    paths:
      - internal/server/codegen

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ssunshineguy/notifier
  exclusions:
    paths:
      - internal/server/codegen
