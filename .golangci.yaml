version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # unclosed HTTP response bodies: client delivery, Information Services
    - rowserrcheck # unchecked rows.Err()
    - sqlclosecheck # unclosed rows/statements
    - contextcheck # context not propagated to calls
    - noctx # HTTP requests without context
    - errorlint # error comparison without errors.Is/As
    - gosec
    - revive
    - misspell
  exclusions:
    paths:
      - internal/server/codegen

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ssunshineguy/notifier
  exclusions:
    paths:
      - internal/server/codegen
