version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - noctx
    - errorlint
    - gosec
    - revive
    - misspell
  exclusions:
    paths:
      - internal/server/codegen

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ssunshineguy/notifier
  exclusions:
    paths:
      - internal/server/codegen
