# DND: Keep the top-level name unset to isolate Compose stacks by checkout directory during parallel local development, especially with AI agents.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Superuser for notifier/db/init only; the service uses the roles created there.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifier
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./notifier/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifier"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: notifier
    image: "${COMPOSE_PROJECT_NAME}-notifier:local"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: "${COMPOSE_PROJECT_NAME}-notifier:local"
    pull_policy: never
    logging:
      options:
        mode: non-blocking
        max-buffer-size: '1m'
    environment:
      NOTIFIER_LOG_LEVEL: ${NOTIFIER_LOG_LEVEL:-INFO}
    command: ["-listen-addr", "0.0.0.0:8080", "api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          status=$$(curl --fail --silent --show-error --noproxy '*' --max-time 3
          --output /dev/null --write-out '%{http_code}'
          http://127.0.0.1:9080/health/ready) && test "$$status" = 200
      interval: 2s
      timeout: 4s
      retries: 10

  notification_worker:
    image: "${COMPOSE_PROJECT_NAME}-notifier:local"
    pull_policy: never
    logging:
      options:
        mode: non-blocking
        max-buffer-size: '1m'
    environment:
      NOTIFIER_LOG_LEVEL: ${NOTIFIER_LOG_LEVEL:-INFO}
    command: ["worker"]
    stop_grace_period: 11s
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      emulator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          status=$$(curl --fail --silent --show-error --noproxy '*' --max-time 3
          --output /dev/null --write-out '%{http_code}'
          http://127.0.0.1:9082/health/ready) && test "$$status" = 200
      interval: 2s
      timeout: 4s
      retries: 10

  emulator:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: emulator
    image: "${COMPOSE_PROJECT_NAME}-emulator:local"
    command: ["-listen-addr", "0.0.0.0:8081"]
    ports:
      - "127.0.0.1::8081"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          status=$$(curl --fail --silent --show-error --noproxy '*' --max-time 3
          --output /dev/null --write-out '%{http_code}'
          http://127.0.0.1:9081/health/ready) && test "$$status" = 200
      interval: 2s
      timeout: 4s
      retries: 10

volumes:
  postgres-data:
