name: notifier

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Superuser for db/init only; the service uses the roles created there.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifier"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: notifier
    image: notifier:local
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: notifier:local
    pull_policy: never
    logging:
      options:
        mode: non-blocking
        max-buffer-size: '1m'
    environment:
      NOTIFIER_LOG_LEVEL: ${NOTIFIER_LOG_LEVEL:-INFO}
    command: ["-listen-addr", "0.0.0.0:8080", "api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          status=$$(curl --fail --silent --show-error --noproxy '*' --max-time 3
          --output /dev/null --write-out '%{http_code}'
          http://127.0.0.1:8080/health/ready) && test "$$status" = 200
      interval: 2s
      timeout: 4s
      retries: 10

volumes:
  postgres-data:
