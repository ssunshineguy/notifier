get:
  operationId: getPrice
  tags:
    - information-services
  summary: Get the emulated price
  description: Returns the price from Information Service 2 in minor units.
  parameters:
    - $ref: ../../../spec/components/parameters/RequestId.yaml
    - $ref: ../components/parameters/ClientId.yaml
  responses:
    "200":
      description: Emulated price in minor units.
      headers:
        X-Request-ID:
          $ref: ../../../spec/components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/information-services/Price.yaml
          example:
            price: 19990
    "400":
      $ref: ../components/responses/BadInformationRequest.yaml
