get:
  operationId: getTime
  tags:
    - information-services
  summary: Get the current time
  description: Returns the current time in UTC from Information Service 1.
  parameters:
    - $ref: ../../../spec/components/parameters/RequestId.yaml
    - $ref: ../components/parameters/ClientId.yaml
  responses:
    "200":
      description: Current time in UTC.
      headers:
        X-Request-ID:
          $ref: ../../../spec/components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/information-services/Time.yaml
          example:
            time: "2026-12-01T09:00:00Z"
    "400":
      $ref: ../components/responses/BadInformationRequest.yaml
