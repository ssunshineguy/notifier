title: Problem
description: Error in the RFC 9457 Problem Details format.
type: object
required:
  - type
  - title
  - status
properties:
  type:
    description: URI identifying the error kind.
    type: string
    format: uri-reference
    example: /problems/validation-error
  title:
    description: Short summary of the error kind, the same for all occurrences.
    type: string
    example: Request validation failed
  status:
    description: HTTP status code.
    type: integer
    example: 400
  detail:
    description: Explanation specific to this occurrence.
    type: string
    example: deadline_dt must be in the future
  request_id:
    description: Value of `X-Request-ID` of the failed request.
    type: string
    example: 6f1c2a9e-0d4b-4b8e-9a51-2c7d3e8f1a20
  errors:
    description: Field-level errors, present for validation failures.
    type: array
    items:
      $ref: ./FieldError.yaml
